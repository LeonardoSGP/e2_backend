# netlify.toml — Configuración de Netlify para el frontend Vue 3 (SPA)
# Documentación: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Directorio raíz del frontend (relativo a la raíz del repositorio)
  base    = "frontend"
  # Comando de build
  command = "npm ci && npm run build"
  # Carpeta con los archivos compilados a servir
  publish = "dist"

# ── Variables de entorno para el build ──────────────────────────────────────
# VITE_API_BASE_URL se configura en el dashboard de Netlify (no hardcoded aquí
# para no exponer la URL del backend en el repositorio).
# Ir a: Site → Site configuration → Environment variables → Add variable
#   Key:   VITE_API_BASE_URL
#   Value: https://<tu-proyecto>.up.railway.app

# ── Redireccionamiento SPA ───────────────────────────────────────────────────
# Redirige TODAS las rutas al index.html para que Vue Router maneje la navegación.
# Sin esto, recargar la página en /admin/dashboard daría un 404 en Netlify.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Headers de seguridad ─────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# ── Cache de assets compilados (Vite genera hashes en los nombres) ───────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
